name: Submit pending reports to Bike Bureau

on:
  schedule:
    # Twice daily at 10am and 8pm Eastern (Detroit). Fixed UTC, so these
    # drift an hour once clocks fall back to EST in November -- flip to
    # '0 15,1 * * *' then, and back to '0 14,0 * * *' when EDT resumes in
    # March -- GitHub Actions cron has no timezone awareness. Bike Bureau
    # has no public API, so this drives their real submit form with
    # Playwright -- see scripts/submit-to-bikebureau.js. Confirm at least
    # one real non-dry-run submission by hand (same as was done for BLU,
    # see submit-to-blu.yml) before enabling this schedule.
    - cron: '0 14,0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fill out each form and screenshot it, then Discard instead of Submit'
        type: boolean
        default: false

jobs:
  submit:
    runs-on: ubuntu-latest
    # Never burn 6h of runner time on a hung browser again -- a healthy run
    # finishes in a few minutes (cf. the 2026-10-02 hang: the script stopped
    # early on a Cloudflare check but the step sat idle for hours because the
    # browser was never closed).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: node scripts/submit-to-bikebureau.js ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bikebureau-dry-run-screenshots
          path: scripts/dry-run-bikebureau/
          if-no-files-found: ignore
